StylesPath = .vale/styles
MinAlertLevel = suggestion

# prose-guard — house anti-slop writing rules.
# Full hard/soft standard and rationale: dev-tools/docs/prose-standard.md
#
# Advisory only. This is NOT wired into the pre-commit hook; Vale runs when you
# invoke it ("vale <path>") or wire it into CI as a non-blocking check. The
# governing principle is "clusters, not single tells" — treat each hit as a
# candidate for human judgment, not an automatic rejection.
[*.{md,markdown,txt}]
BasedOnStyles = AITells
